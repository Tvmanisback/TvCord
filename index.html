r:0;color:#bbb}.members{width:205px;background:#1b1c21;border-left:1px solid var(--line);padding:18px 10px;overflow:auto}.member{display:flex;gap:9px;align-items:center;padding:8px 4px}.member small{display:block;color:var(--muted);font-size:10px}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(440px,100%);max-height:90vh;overflow:auto;padding:25px;background:#25262d;border:1px solid #444;border-radius:16px}.modal h2{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#30313a;border:1px solid #555;padding:12px 16px;border-radius:9px;z-index:30;max-width:90vw}.pill{font-size:10px;background:#3a3b45;border-radius:20px;padding:3px 7px;color:#ddd}.friendslist{padding:10px}.friendrow{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.friendrow .username{flex:1}.smallbtn{padding:7px 10px;font-size:12px}.banner{width:100%;height:80px;object-fit:cover;border-radius:8px;background:#333;margin-bottom:10px}@media(max-width:850px){.members{display:none}}@media(max-width:620px){.rail{width:54px;padding:10px 6px}.rail button{width:40px;height:40px}.side{width:205px}.top{padding:0 9px}.chat{padding:12px}.composer{margin:0 7px 8px}.sidehead{padding:0 10px}.userbar{padding:8px}.userbar .secondary{padding:7px}.top .muted{display:none}}

<script type="module">

const $=id=>document.getElementById(id); let session=null, profile=null, servers=[], server=null, channels=[], channel=null, messages=[], members=[], friends=[], mode='login', view='chat', realtime=null, voiceChannel=null, voiceRoom=null, voicePeers=new Map();

function notify(s){$('notice').textContent=s;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),4000)}
function showAuth(){$('root').innerHTML='<section class="auth"><div class="authbox"><div class="logo">T</div><p class="muted">YOUR PEOPLE. YOUR SPACE.</p><h1>Welcome to TvCord</h1><p class="muted">Chat with friends. Customize everything. No premium tier.</p><p id="configError" class="muted">Ready to sign in</p><form id="authForm"><label class="field hidden" id="nameField">Username<input id="username" maxlength="32" placeholder="Your display name"></label><label class="field">Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters"></label><button class="primary full" id="authSubmit">Log in</button></form><p><button id="authSwitch" class="secondary full" style="margin-top:10px">Need an account? Sign up</button></p><p class="muted" style="font-size:11px">Keep your password private. GIF avatars and custom colors are free.</p></div></section>';$('authSwitch').onclick=()=>{mode=mode==='login'?'signup':'login';$('authSubmit').textContent=mode==='login'?'Log in':'Create account';$('authSwitch').textContent=mode==='login'?'Need an account? Sign up':'Already registered? Log in';$('nameField').classList.toggle('hidden',mode!=='signup');$('password').autocomplete=mode==='login'?'current-password':'new-password'};$('authForm').onsubmit=async e=>{e.preventDefault();$('authSubmit').disabled=true;let r=mode==='signup'?await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{username:$('username').value.trim()||$('email').value.split('@')[0]}}}):await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authSubmit').disabled=false;if(r.error)return notify(r.error.message);if(mode==='signup'&&!r.data.session)return notify('Account created. Check your email to confirm, then log in.');session=r.data.session;await boot()}}
function avatar(p,size=''){return '<div class="avatar '+size+'">'+(p?.avatar_url?'<img src="'+esc(p.avatar_url)+'">':esc(initials(p?.username)))+'</div>'}
$('authSwitch').onclick=()=>{mode=mode==='login'?'signup':'login';$('authSubmit').textContent=mode==='login'?'Log in':'Create account';$('authSwitch').textContent=mode==='login'?'Need an account? Sign up':'Already registered? Log in';$('nameField').classList.toggle('hidden',mode!=='signup');$('password').autocomplete=mode==='login'?'current-password':'new-password'};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authSubmit').disabled=true;let r=mode==='signup'?await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{username:$('username').value.trim()||$('email').value.split('@')[0]}}}):await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authSubmit').disabled=false;if(r.error)return notify(r.error.message);if(mode==='signup'&&!r.data.session)return notify('Account created. Check your email to confirm, then log in.');session=r.data.session;await boot()};
sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT'){profile=null;servers=[];server=null;channels=[];channel=null;messages=[];friends=[];if(realtime){sb.removeChannel(realtime);realtime=null}showAuth();}});
async function boot(){if(!session)return;const u=session.user;let q=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(!q.data){let p={id:u.id,username:u.user_metadata?.username||u.email.split('@')[0],accent_color:'#e34b64',status_text:''};q=await sb.from('profiles').upsert(p).select().single()}profile=q.data;if(!profile)return notify(q.error?.message||'Could not load profile');await loadServers();render()}
async function loadServers(){let r=await sb.from('server_members').select('server_id,role,servers(id,name,owner_id,invite_code)').eq('user_id',session.user.id);if(r.error){notify(r.error.message);return}servers=(r.data||[]).map(x=>({...x.servers,role:x.role})).filter(Boolean);if(!server||!servers.some(s=>s.id===server.id))server=servers[0]||null;await loadChannels()}
async function loadChannels(){channels=[];channel=null;members=[];if(!server)return;let c=await sb.from('channels').select('*').eq('server_id',server.id).order('position');channels=c.data||[];channel=channels.find(c=>c.type==='text')||channels[0]||null;let m=await sb.from('server_members').select('role,profiles(id,username,avatar_url,status_text,accent_color)').eq('server_id',server.id);members=(m.data||[]).map(x=>({...x.profiles,role:x.role})).filter(Boolean);await loadMessages()}
async function loadMessages(){if(realtime){sb.removeChannel(realtime);realtime=null}messages=[];if(!channel){render();return}let r=await sb.from('messages').select('id,content,created_at,user_id,attachment_url,attachment_name,profiles(id,username,avatar_url,accent_color)').eq('channel_id',channel.id).order('created_at').limit(150);if(r.error)notify(r.error.message);messages=r.data||[];realtime=sb.channel('tvcord-'+channel.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+channel.id},async p=>{let x=await sb.from('messages').select('id,content,created_at,user_id,attachment_url,attachment_name,profiles(id,username,avatar_url,accent_color)').eq('id',p.new.id).single();if(x.data&&!messages.some(m=>m.id===x.data.id)){messages.push(x.data);if(view==='chat')renderChat()}}).subscribe();render()}
function render(){if(!session)return;document.documentElement.style.setProperty('--accent',profile?.accent_color||'#e34b64');$('root').innerHTML='<div class="app"><aside class="rail"><button class="tlogo" onclick="window.tvHome()">T</button><button title="Friends and requests" onclick="window.tvFriends()">♥</button><button title="Add friend" onclick="window.tvAddFriend()">+</button><hr>'+servers.map(s=>'<button class="'+(server?.id===s.id?'active':'')+'" title="'+esc(s.name)+'" onclick="window.tvServer(\''+s.id+'\')">'+esc(initials(s.name))+'</button>').join('')+'<button title="Create server" onclick="window.tvCreateServer()">+</button><button title="Join server" onclick="window.tvJoinServer()">⌕</button></aside><aside class="side"><div class="sidehead"><span>'+esc(view==='friends'?'Friends':server?.name||'Your spaces')+'</span><button class="secondary smallbtn" onclick="window.tvProfile()">⚙</button></div><div class="scroll">'+(view==='friends'?friendsSidebar():server?'<div class="section">TEXT CHANNELS <button onclick="window.tvCreateChannel()">+</button></div>'+channels.filter(c=>c.type==='text').map(c=>'<button class="item '+(channel?.id===c.id?'active':'')+'" onclick="window.tvChannel(\''+c.id+'\')"># '+esc(c.name)+'</button>').join('')+'<div class="section">VOICE CHANNELS <button onclick="window.tvCreateVoiceChannel()">+</button></div>'+channels.filter(c=>c.type==='voice').map(c=>'<button class="item '+(voiceChannel?.id===c.id?'active':'')+'" onclick="window.tvJoinVoice(\''+c.id+'\')">🔊 '+esc(c.name)+'</button>').join('')+'<p class="muted" style="padding:8px;font-size:12px">Voice needs microphone permission.</p><button class="item" onclick="window.tvServerInfo()">♧ Invite & server info</button>':'<p class="muted" style="padding:10px">Create a server or join using an invite code.</p><button class="primary full" onclick="window.tvCreateServer()">Create server</button><button class="secondary full" style="margin-top:8px" onclick="window.tvJoinServer()">Join server</button>')+'</div><div class="userbar">'+avatar(profile)+'<div class="username"><strong>'+esc(profile.username)+'</strong><small>'+esc(profile.status_text||'Online')+'</small></div><button class="secondary smallbtn" onclick="window.tvLogout()">↪</button></div></aside><main class="main"><header class="top">'+(view==='friends'?'♥ Friends':channel?'# '+esc(channel.name):'TvCord')+'<span class="muted">'+(view==='friends'?'Add people and manage requests':server?'Live community chat':'Welcome to TvCord')+'</span><button class="secondary smallbtn" onclick="window.tvProfile()">Profile</button>${voiceChannel?'<button class="secondary smallbtn" onclick="window.tvMuteVoice()">Mute</button><button class="secondary smallbtn" onclick="window.tvLeaveVoice()">Leave voice</button>':''}</header><section class="chat" id="chat">'+(view==='friends'?friendsView():renderChatHtml())+'</section>'+(view==='chat'&&channel?'<form class="composer" id="sendForm"><button type="button" title="Upload image/GIF" onclick="document.getElementById(\'filePick\').click()">＋</button><input type="file" id="filePick" hidden accept="image/*,.pdf,.txt,.zip"><input id="draft" maxlength="4000" placeholder="Message #'+esc(channel.name)+'"><button type="submit">➤</button></form>':'')+'</main><aside class="members"><b class="muted">MEMBERS — '+members.length+'</b>'+members.map(m=>'<div class="member">'+avatar(m)+'<div>'+esc(m.username)+'<small>'+esc(m.role||'member')+'</small></div></div>').join('')+'</aside></div>';if(view==='chat'&&channel){$('sendForm').onsubmit=sendMessage;$('filePick').onchange=e=>{upload(e.target.files[0]);e.target.value=''}}}
function renderChatHtml(){return channel?'<div class="welcome"><h2>Welcome to #'+esc(channel.name)+'!</h2><p class="muted">This is the beginning of this channel.</p></div>'+messages.map(m=>'<div class="msg">'+avatar(m.profiles)+'<div class="msgbody"><div class="msgmeta"><strong style="color:'+esc(m.profiles?.accent_color||'var(--text)')+'">'+esc(m.profiles?.username||'Unknown')+'</strong><small>'+new Date(m.created_at).toLocaleString()+'</small></div>'+(m.content?'<p>'+esc(m.content)+'</p>':'')+(m.attachment_url?(m.attachment_name||'').match(/\.(png|jpe?g|gif|webp|avif)$/i)?'<a href="'+esc(m.attachment_url)+'" target="_blank"><img class="attach" src="'+esc(m.attachment_url)+'"></a>':'<a href="'+esc(m.attachment_url)+'" target="_blank">'+esc(m.attachment_name||'Attachment')+'</a>':'')+'</div></div>').join(''):'<h2>Make yourself at home.</h2><p class="muted">Create a server or join one to start chatting.</p>'}

async function sendMessage(e){e.preventDefault();let content=$('draft').value.trim();if(!content||!channel)return;const draft=$('draft');draft.value='';let r=await sb.from('messages').insert({channel_id:channel.id,user_id:session.user.id,content});if(r.error){draft.value=content;notify(r.error.message)}}
async function upload(file){if(!file)return;if(file.size>25*1024*1024)return notify('File limit is 25 MB.');let path=session.user.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');let u=await sb.storage.from('attachments').upload(path,file,{contentType:file.type});if(u.error)return notify(u.error.message);let url=sb.storage.from('attachments').getPublicUrl(path).data.publicUrl;let r=await sb.from('messages').insert({channel_id:channel.id,user_id:session.user.id,content:'',attachment_url:url,attachment_name:file.name});if(r.error)notify(r.error.message)}
function friendsSidebar(){return '<button class="item active" onclick="window.tvFriends()">♥ All friends</button><button class="item" onclick="window.tvAddFriend()">＋ Add friend</button><button class="item" onclick="window.tvRequests()">↗ Requests</button>'}

window.tvCreateServer=()=>modal('Create a server','<form id="serverForm"><label class="field">Server name<input name="name" maxlength="80" required></label><button class="primary full">Create server</button></form>'); 
document.addEventListener('submit',async e=>{if(e.target.id==='serverForm'){e.preventDefault();let name=new FormData(e.target).get('name').trim();let r=await sb.rpc('create_server',{server_name:name});if(r.error)return notify(r.error.message);window.tvCloseModal();await loadServers();render()}if(e.target.id==='joinForm'){e.preventDefault();let code=new FormData(e.target).get('code').trim();try{if(code.includes('invite='))code=new URL(code).searchParams.get('invite')||code;else if(code.includes('/invite/'))code=code.split('/invite/').pop().split(/[?#]/)[0]}catch{}let r=await sb.rpc('join_server_by_invite',{code});if(r.error)return notify(r.error.message);window.tvCloseModal();await loadServers();render()}if(e.target.id==='voiceChannelForm'){e.preventDefault();let name=new FormData(e.target).get('name').toLowerCase().replace(/[^a-z0-9-]/g,'-');let r=await sb.from('channels').insert({server_id:server.id,name,type:'voice',position:channels.length}).select().single();if(r.error)return notify(r.error.message);channels.push(r.data);window.tvCloseModal();render()}if(e.target.id==='serverSettingsForm'){e.preventDefault();let fd=new FormData(e.target);let patch={name:fd.get('name').trim()};let code=(fd.get('code')||'').trim().toUpperCase();if(server.owner_id===session.user.id&&code&&code!==server.invite_code){let level=server.level||1;if(level<10)return notify('Custom invite codes unlock at server level 10.');patch.invite_code=code}let r=await sb.from('servers').update(patch).eq('id',server.id).select().single();if(r.error)return notify(r.error.message);server={...server,...r.data};servers=servers.map(x=>x.id===server.id?server:x);window.tvCloseModal();render()}if(e.target.id==='channelForm'){e.preventDefault();let name=new FormData(e.target).get('name').toLowerCase().replace(/[^a-z0-9-]/g,'-');let r=await sb.from('channels').insert({server_id:server.id,name,type:'text',position:channels.length}).select().single();if(r.error)return notify(r.error.message);channels.push(r.data);channel=r.data;window.tvCloseModal();await loadMessages()}if(e.target.id==='friendForm'){e.preventDefault();let uname=new FormData(e.target).get('username').trim();let r=await sb.rpc('send_friend_request',{target_username:uname});if(r.error)return notify(r.error.message);window.tvCloseModal();notify('Friend request sent.')}if(e.target.id==='profileForm'){e.preventDefault();let fd=new FormData(e.target);let patch={username:fd.get('username').trim(),status_text:fd.get('status').trim(),accent_color:fd.get('accent')};let r=await sb.from('profiles').update(patch).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}if(e.target.id==='bannerForm'){e.preventDefault();let file=new FormData(e.target).get('banner');if(!file?.size)return;let path=session.user.id+'/banner-'+Date.now()+'.'+(file.name.split('.').pop()||'gif');let up=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});if(up.error)return notify(up.error.message);let url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;let r=await sb.from('profiles').update({banner_url:url}).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}});

window.tvJoinServer=()=>modal('Join a server','<form id="joinForm"><label class="field">Invite code or invite link<input name="code" required placeholder="ABC123 or https://tvmanisback.github.io/TvCord/?invite=ABC123"></label><button class="primary full">Join server</button></form>');
window.tvCreateChannel=()=>server?modal('Create a text channel','<form id="channelForm"><label class="field">Channel name<input name="name" maxlength="60" required></label><button class="primary full">Create channel</button></form>'):notify('Choose a server first.');
window.tvCreateVoiceChannel=()=>server?modal('Create a voice channel','<form id="voiceChannelForm"><label class="field">Channel name<input name="name" maxlength="60" required></label><button class="primary full">Create voice channel</button></form>'):notify('Choose a server first.');
window.tvJoinVoice=async id=>{const vc=channels.find(c=>c.id===id);if(!vc)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChannel=vc;voiceRoom=sb.channel('voice-'+vc.id,{config:{broadcast:{self:false},presence:{key:session.user.id}}});voiceRoom.on('broadcast',{event:'signal'},async({payload})=>{if(payload.to!==session.user.id)return;await handleVoiceSignal(payload)}).on('presence',{event:'sync'},async()=>{const state=voiceRoom.presenceState();for(const [key,items] of Object.entries(state)){if(key===session.user.id||voicePeers.has(key)||!items?.length)continue;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});voicePeers.set(key,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:key,from:session.user.id,candidate:e.candidate}})};pc.ontrack=e=>{let a=document.getElementById('voice-audio-'+key);if(!a){a=document.createElement('audio');a.id='voice-audio-'+key;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await voiceRoom.send({type:'broadcast',event:'signal',payload:{to:key,from:session.user.id,offer:pc.localDescription}})}}).subscribe(async status=>{if(status==='SUBSCRIBED'){await voiceRoom.track({user_id:session.user.id,username:profile.username});notify('Joined voice: '+vc.name+' (microphone on)')}});window.tvLeaveVoice=async()=>{for(const p of voicePeers.values())p.close();voicePeers.clear();if(voiceRoom){await voiceRoom.unsubscribe();voiceRoom=null}stream.getTracks().forEach(t=>t.stop());voiceChannel=null;notify('Left voice channel');render()};window.tvMuteVoice=()=>{stream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);notify(stream.getAudioTracks()[0]?.enabled?'Microphone on':'Microphone muted')};window.tvVoiceStream=stream;render()}catch(e){notify('Could not access microphone: '+(e.message||'permission denied'))}};
async function handleVoiceSignal(p){let pc=voicePeers.get(p.from);if(!pc){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});voicePeers.set(p.from,pc);(window.tvVoiceStream?.getTracks()||[]).forEach(t=>pc.addTrack(t,window.tvVoiceStream));pc.onicecandidate=e=>{if(e.candidate)voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:p.from,from:session.user.id,candidate:e.candidate}})};pc.ontrack=e=>{let a=document.getElementById('voice-audio-'+p.from);if(!a){a=document.createElement('audio');a.id='voice-audio-'+p.from;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]}}if(p.offer){await pc.setRemoteDescription(p.offer);await pc.setLocalDescription(await pc.createAnswer());await voiceRoom.send({type:'broadcast',event:'signal',payload:{to:p.from,from:session.user.id,answer:pc.localDescription}})}if(p.answer)await pc.setRemoteDescription(p.answer);if(p.candidate)try{await pc.addIceCandidate(p.candidate)}catch{}}
window.tvServerSettings=()=>{if(!server)return;const can=server.owner_id===session.user.id;modal('Server settings','<form id="serverSettingsForm"><label class="field">Server name<input name="name" maxlength="80" required value="'+esc(server.name)+'" '+(!can?'disabled':'')+'></label><label class="field">Custom invite code <small>Unlocked at server level 10</small><input name="code" maxlength="24" pattern="[A-Za-z0-9_-]{4,24}" value="'+esc(server.invite_code)+'" '+(!can?'disabled':'')+'></label><p class="muted">Server level and tags need activity-based leveling to be configured; tags unlock at level 3.</p><button class="primary full" '+(!can?'disabled':'')+'>Save settings</button></form>')};
window.tvServerInfo=()=>server?modal(esc(server.name),'<p class="muted">Shareable invite link</p><p><code>'+esc(location.origin+location.pathname+'?invite='+encodeURIComponent(server.invite_code))+'</code></p><button class="secondary" onclick="navigator.clipboard.writeText(\''+location.origin+location.pathname+'?invite='+server.invite_code+'\').then(()=>notify(\'Invite link copied\'))">Copy invite link</button><hr><button class="secondary" onclick="window.tvServerSettings()">Server settings</button>'):notify('Choose a server first.');
window.tvProfile=()=>modal('Customize your profile','<form id="profileForm"><label class="field">Username<input name="username" maxlength="32" required value="'+esc(profile.username)+'"></label><label class="field">Status<input name="status" maxlength="80" value="'+esc(profile.status_text||'')+'"></label><label class="field">Accent color<input type="color" name="accent" value="'+esc(profile.accent_color||'#e34b64')+'"></label><button class="primary full">Save profile</button></form><hr><form id="avatarForm"><label class="field">Animated avatar (GIF supported)<input type="file" name="avatar" accept="image/*" required></label><button class="secondary full">Upload avatar</button></form><hr><form id="bannerForm"><label class="field">Free profile banner (GIF supported)<input type="file" name="banner" accept="image/*" required></label><button class="secondary full">Upload banner</button></form>'+(profile.banner_url?'<img class="banner" src="'+esc(profile.banner_url)+'">':''));
document.addEventListener('submit',async e=>{if(e.target.id==='avatarForm'){e.preventDefault();let f=new FormData(e.target).get('avatar');let path=session.user.id+'/avatar-'+Date.now()+'.'+(f.name.split('.').pop()||'gif');let u=await sb.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(u.error)return notify(u.error.message);let url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;let r=await sb.from('profiles').update({avatar_url:url}).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}});
window.tvFriends=async()=>{view='friends';server=null;await loadFriends();render()};
window.tvOpenDoc=which=>{const title=which==='tos'?'TvCord Terms of Service':'TvCord Privacy Policy';const body=which==='tos'?'<h2>1. Be respectful</h2><p>Swearing is allowed. Harassment, threats, targeted abuse, hate, sexual exploitation, and illegal activity are not.</p><h2>2. No harmful content</h2><p>Do not post sexual content involving minors, non-consensual intimate content, malware, scams, credential theft, or content that endangers people.</p><h2>3. Account integrity</h2><p>No bots or automation used to mass-create accounts, spam, evade enforcement, or manipulate services. Accessibility tools and benign integrations must not abuse the service.</p><h2>4. Security</h2><p>Do not attempt to break into accounts, bypass permissions, disrupt services, or distribute malicious code.</p><h2>5. Enforcement</h2><p>TvCord may restrict or remove content or accounts that violate these rules. Report abuse and suspicious behavior.</p><p class="muted">Draft policy. Publish a contact and effective date before public launch.</p>':'<h2>Information stored</h2><p>TvCord uses Supabase to process account details, usernames, profile customization, messages, server membership, friend requests, and files you choose to upload.</p><h2>How information is used</h2><p>Information is used to provide chat, account security, moderation, and app functionality.</p><h2>Sharing and visibility</h2><p>Messages and profile information may be visible to members with access to the relevant server or conversation. Public storage links may make uploaded files accessible to anyone with the link.</p><h2>Retention and control</h2><p>Do not upload sensitive information. You can request account/data removal from the service operator. This draft does not promise a deletion workflow until one is implemented.</p><p class="muted">Draft policy. Add a contact and effective date before public launch.</p>';document.getElementById('root').innerHTML='<section class="auth" style="display:block;overflow:auto"><article class="authbox" style="width:min(850px,100%);margin:24px auto"><button class="secondary" onclick="history.length>1?history.back():location.assign(\'/TvCord/\')">← Back</button><p class="muted">TVCORD • DOCUMENT</p><h1>'+title+'</h1><p class="muted">Last updated: October 2026</p>'+body+'</article></section>'};
async function loadFriends(){let r=await sb.from('friendships').select('id,requester_id,addressee_id,status,requester:profiles!friendships_requester_id_fkey(id,username,avatar_url,status_text),addressee:profiles!friendships_addressee_id_fkey(id,username,avatar_url,status_text)').or('requester_id.eq.'+session.user.id+',addressee_id.eq.'+session.user.id).eq('status','accepted');friends=(r.data||[]).map(f=>({id:f.id,profile:f.requester_id===session.user.id?f.addressee:f.requester,otherId:f.requester_id===session.user.id?f.addressee_id:f.requester_id}));}
window.tvAddFriend=()=>modal('Add a friend','<p class="muted">Enter their exact TvCord username.</p><form id="friendForm"><label class="field">Username<input name="username" required maxlength="32"></label><button class="primary full">Send request</button></form>');
window.tvRequests=async()=>{let r=await sb.from('friendships').select('id,requester_id,requester:profiles!friendships_requester_id_fkey(id,username,avatar_url)').eq('addressee_id',session.user.id).eq('status','pending');if(r.error)return notify(r.error.message);modal('Friend requests',(r.data||[]).map(x=>'<div class="friendrow">'+avatar(x.requester)+'<div class="username"><strong>'+esc(x.requester.username)+'</strong><small>Wants to connect</small></div><button class="primary smallbtn" onclick="window.tvAccept(\''+x.id+'\')">Accept</button><button class="secondary smallbtn" onclick="window.tvReject(\''+x.id+'\')">Reject</button></div>').join('')||'<p class="muted">No pending requests.</p>')};
window.tvAccept=async id=>{let r=await sb.from('friendships').update({status:'accepted'}).eq('id',id).eq('addressee_id',session.user.id);if(r.error)return notify(r.error.message);window.tvRequests();loadFriends()};
window.tvReject=async id=>{let r=await sb.from('friendships').delete().eq('id',id).eq('addressee_id',session.user.id);if(r.error)return notify(r.error.message);window.tvRequests()};
window.tvDM=async other=>{let r=await sb.rpc('get_or_create_dm',{other_user:other});if(r.error)return notify(r.error.message);view='dm';modal('Direct messages','<p class="muted">DM conversation created. DM tables and realtime transport require the TvCord social migration to be run in Supabase.</p><code>'+esc(r.data)+'</code>')};
window.tvLogout=async()=>{const r=await sb.auth.signOut();if(r.error)return notify(r.error.message);};
sb.auth.getSession().then(({data})=>{session=data.session;if(session)boot();else $('configError').textContent='Ready to sign in'});
</script></body></html>
