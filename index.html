function renderMemberGroups(){const groups=[];const owner=members.filter(m=>m.id===server?.owner_id);if(owner.length)groups.push({name:'OWNER',members:owner,color:'#f0c36a'});const admins=members.filter(m=>m.id!==server?.owner_id&&m.role==='admin');if(admins.length)groups.push({name:'ADMIN',members:admins,color:'#e34b64'});for(const role of [...serverRoles].sort((a,b)=>(Number(b.position)||0)-(Number(a.position)||0))){const matching=members.filter(m=>m.id!==server?.owner_id&&(m.customRoles||[]).some(r=>r.name===role.name));if(matching.length)groups.push({name:role.name,members:matching,color:role.color||'#b9bac5'});}const inCustom=new Set(groups.filter(g=>g.name!=='OWNER'&&g.name!=='ADMIN').flatMap(g=>g.members.map(m=>m.id)));const ordinary=members.filter(m=>m.id!==server?.owner_id&&m.role!=='admin'&&!inCustom.has(m.id));if(ordinary.length)groups.push({name:'MEMBER',members:ordinary,color:'#999ba8'});return groups.map(g=>'<div class="section" style="margin:16px 4px 7px;color:'+esc(g.color)+'"><span>'+esc(g.name.toUpperCase())+' - '+g.members.length+'</span></div>'+g.members.map(m=>'<div class="member">'+avatar(m)+'<div><button class="item" style="padding:0;background:none" onclick="window.tvViewProfile(\\''+m.id+'\\')">'+esc(m.username)+'</button>'+adminBadge(m.id)+(m.customRoles||[]).filter(r=>r.name!==g.name).map(r=>'<small style="color:'+esc(r.color)+'">'+esc(r.name)+'</small>').join('')+'</div></div>').join('')).join('')||'<p class="muted">No members loaded.</p>'}
function render(){if(!session)return;document.documentElement.style.setProperty('--accent',TV_THEMES[window.tvCurrentTheme||'default']?.['--accent']||'#e34b64');$('root').innerHTML='<div class="app"><aside class="rail"><button class="tlogo" title="TvCord main menu" onclick="window.tvHome()">T</button>'+servers.map(s=>'<button class="'+(server?.id===s.id?'active':'')+'" title="'+esc(s.name)+'" onclick="window.tvServer(\''+s.id+'\')">'+(s.icon_url?'<img src="'+esc(s.icon_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':esc(initials(s.name)))+'</button>').join('')+'<button title="Create server" onclick="window.tvCreateServer()">+</button><button title="Join server" onclick="window.tvDiscover()">⌕</button><button title="Join by invite" onclick="window.tvJoinServer()">↪</button></aside><aside class="side"><div class="sidehead"><span>'+esc(view==='friends'?'Friends':server?.name||'Your spaces')+'</span><button class="secondary smallbtn" title="'+(view==='friends'?'Profile, themes & account':'Server menu')+'" onclick="'+(view==='friends'?'window.tvProfile()':'window.tvServerInfo()')+'">⌄</button></div><div class="scroll">'+(view==='friends'?friendsSidebar():server?'<div class="section">TEXT CHANNELS <button onclick="window.tvCreateChannel()">+</button></div>'+channels.filter(c=>c.type==='text').map(c=>'<button class="item '+(channel?.id===c.id?'active':'')+'" onclick="window.tvChannel(\''+c.id+'\')"># '+esc(c.name)+'</button>').join('')+'<div class="section">VOICE CHANNELS <button onclick="window.tvCreateVoiceChannel()">+</button></div>'+channels.filter(c=>c.type==='voice').map(c=>'<button class="item '+(voiceChannel?.id===c.id?'active':'')+'" onclick="window.tvJoinVoice(\''+c.id+'\')">🔊 '+esc(c.name)+(voiceChannel?.id===c.id?' <span class="pill">'+voiceMembers.length+'</span>':'')+'</button>'+(voiceChannel?.id===c.id?'<div class="voice-members">'+voiceMembers.map(p=>'<div class="voice-member"><span class="voice-dot"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.username)+'</span>'+(p.muted?' 🔇':'')+(p.live?' 🔴':'')+'</div>').join('')+'</div>':'')).join('')+'<p class="muted" style="padding:8px;font-size:12px">Voice needs microphone permission.</p><button class="item" onclick="window.tvServerInfo()">♧ Invite & server info</button>':'<p class="muted" style="padding:10px">Create a server or join using an invite code.</p><button class="primary full" onclick="window.tvCreateServer()">Create server</button><button class="secondary full" style="margin-top:8px" onclick="window.tvJoinServer()">Join server</button>')+'</div><div class="userbar">'+avatar(profile)+'<div class="username"><strong>'+esc(profile.username)+adminBadge(session.user.id)+'</strong><small>'+esc(profile.status_text||'Online')+'</small></div><button class="secondary smallbtn" title="User settings" onclick="window.tvProfile()">⚙</button><button class="secondary smallbtn" title="Log out" onclick="window.tvLogout()">↪</button></div></aside><main class="main"><header class="top">'+(server?.banner_url?'<img class="server-banner" src="'+esc(server.banner_url)+'" alt="">':'')+(voiceChannel?'🔊 '+esc(voiceChannel.name):(view==='friends'?'♥ Friends':channel?'# '+esc(channel.name):'TvCord'))+'<span class="muted">'+(voiceChannel?'Voice connected · '+voiceMembers.length+' here':(view==='friends'?'Add people and manage requests':server?'Live community chat':'Welcome to TvCord'))+'</span>'+(voiceChannel?'<button class="secondary smallbtn" onclick="window.tvMuteVoice()">Mute</button><button class="secondary smallbtn" onclick="window.tvLeaveVoice()">Leave voice</button>':'')+'</header><section class="chat" id="chat">'+(voiceChannel?renderVoiceStage():(view==='friends'?friendsView():renderChatHtml()))+'</section>'+(view==='chat'&&channel&&!voiceChannel?'<form class="composer" id="sendForm"><button type="button" title="Attach a file (max 50 MB)" aria-label="Attach a file" onclick="document.getElementById(\'filePick function formatChatText(content){let text=esc(content);for(const e of serverEmojis){const token=':'+e.name+':';text=text.split(token).join('<img src="'+esc(e.image_url)+'" alt="'+token+'" title="'+token+'" style="width:1.35em;height:1.35em;object-fit:contain;vertical-align:middle">')}return text}
function renderChatHtml(){
 if(!channel)return '<h2>Make yourself at home.</h2><p class="muted">Create a server or join one to start chatting.</p>';
 return '<div class="welcome"><h2>Welcome to #'+esc(channel.name)+'!</h2><p class="muted">This is the beginning of this channel.</p></div>'+messages.map(m=>{
  const name=m.attachment_name||'Attachment',path=m.attachment_path||'',url=m.attachment_url||'';
  const ep=encodeURIComponent(path),en=encodeURIComponent(name),eu=encodeURIComponent(url);
  const isImage=/\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i.test(name);
  const isZip=/\.(zip|cbz)$/i.test(name);
  const isText=/\.(js|ts|jsx|tsx|html|css|json|xml|yml|yaml|md|txt|py|java|c|cpp|h|cs|sh|sql|toml|ini|rs|go|php|rb|lua|log|csv)$/i.test(name);
  let attachment='';
  if(m.attachment_name||m.attachment_path){
   if(!url) attachment='<div class="filecard"><span class="filetype">'+(isImage?'🖼️':isZip?'🗜️':isText?'📜':'📄')+'</span><div class="fileinfo"><strong>'+esc(name)+'</strong><small>Attachment link unavailable · retry or contact the server owner</small></div><button class="primary smallbtn" onclick="window.tvDownloadAttachment(\''+ep+'\',\''+en+'\')">Download</button></div>';
   else if(isImage) attachment='<a href="'+esc(url)+'" target="_blank" rel="noopener"><img class="attach" src="'+esc(url)+'" alt="'+esc(name)+'" loading="lazy" onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<small>Image preview unavailable. Try Download.</small>\')"></a><div class="fileactions"><button class="secondary smallbtn" onclick="window.tvPreviewAttachment(\''+ep+'\',\''+en+'\',\''+eu+'\')">Preview</button><button class="primary smallbtn" onclick="window.tvDownloadAttachment(\''+ep+'\',\''+en+'\')">Download image</button></div><small class="muted">Attachments are not content-scanned. Report anything unsafe.</small>';
   else attachment='<div class="filecard"><span class="filetype">'+(isZip?'🗜️':isText?'📜':'📄')+'</span><div class="fileinfo"><strong>'+esc(name)+'</strong><small>'+(isZip?'Compressed archive':isText?'Text / source code':'File attachment')+' · '+esc((name.split('.').pop()||'FILE').toUpperCase())+'</small></div><div class="fileactions">'+(isText?'<button class="secondary smallbtn" onclick="window.tvPreviewAttachment(\''+ep+'\',\''+en+'\',\''+eu+'\')">View code</button>':'')+(isZip?'<button class="secondary smallbtn" onclick="window.tvListZip(\''+ep+'\',\''+en+'\',\''+eu+'\')">View contents</button>':'<button class="secondary smallbtn" onclick="window.tvPreviewAttachment(\''+ep+'\',\''+en+'\',\''+eu+'\')">Preview</button>')+'<button class="primary smallbtn" onclick="window.tvDownloadAttachment(\''+ep+'\',\''+en+'\')">Download</button></div></div><small class="muted">Attachments are not content-scanned. Report anything unsafe.</small>';
  }
  return '<div class="msg"><button class="profilelink avatarlink" title="View profile" onclick="window.tvViewProfile(\''+m.user_id+'\')">'+avatar(m.profiles)+'</button><div class="msgbody"><div class="msgmeta"><button class="profilelink" onclick="window.tvViewProfile(\''+m.user_id+'\')">'+esc(m.profiles?.username||'Unknown')+'</button>'+adminBadge(m.user_id)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>'+(m.content?'<p>'+formatChatText(m.content)+'</p>':'')+attachment+((m.user_id===session.user.id||members.some(x=>x.id===session.user.id&&['owner','admin'].includes(x.role)))?'<button class="secondary smallbtn" style="margin-top:5px" onclick="window.tvDeleteMessage(\''+m.id+'\')">Delete</button>':'')+'<button class="secondary smallbtn" style="margin-top:5px" onclick="window.tvReportMessage(\''+m.id+'\',\''+m.user_id+'\')">Report</button></div></div>';
 }).join('');
}

async function sendMessage(e){e.preventDefault();let content=$('draft').value.trim();if(!content||!channel)return;const draft=$('draft');draft.value='';let r=await sb.from('messages').insert({channel_id:channel.id,user_id:session.user.id,content});if(r.error){draft.value=content;notify(r.error.message.includes('TvCord moderation:')?r.error.message:'Message could not be sent: '+r.error.message)}}
async function upload(file){if(!file)return;const mime=file.type||'application/octet-stream';if(file.size>50*1024*1024)return notify('File limit is 50 MB.');if(!channel)return notify('Choose a channel first.');if(!session?.user)return notify('Sign in before uploading.');if(!file.name||file.name.length>180)return notify('File name is too long.');const path=session.user.id+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^\w.-]/g,'_');notify('Uploading '+file.name+'…');const u=await sb.storage.from('attachments').upload(path,file,{contentType:mime,upsert:false});if(u.error)return notify('Upload failed: '+u.error.message);const r=await sb.from('messages').insert({channel_id:channel.id,user_id:session.user.id,content:'',attachment_url:path,attachment_name:file.name});if(r.error){await sb.storage.from('attachments').remove([path]);return notify('File uploaded but could not be sent: '+r.error.message)}notify('File sent: '+file.name)}

window.tvPreviewAttachment=async(pathEncoded,nameEncoded,urlEncoded)=>{const path=decodeURIComponent(pathEncoded),name=decodeURIComponent(nameEncoded),url=decodeURIComponent(urlEncoded);if(!url)return notify('Preview unavailable: the private attachment link could not be created.');if(/\\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i.test(name)){modal(esc(name),'<img src="'+esc(url)+'" alt="'+esc(name)+'" style="max-width:100%;max-height:65vh;object-fit:contain;display:block;margin:auto"><div class="actions"><button class="primary" onclick="window.tvDownloadAttachment(decodeURIComponent(\''+encodeURIComponent(path)+'\'),decodeURIComponent(\''+encodeURIComponent(name)+'\'))">Download</button></div>');return}if(!/\\.(js|ts|jsx|tsx|html|css|json|xml|yml|yaml|md|txt|py|java|c|cpp|h|cs|sh|sql|toml|ini|rs|go|php|rb|lua|log|csv)$/i.test(name))return notify('Preview is supported for images and text/code files. Download this file to open it.');modal('Loading preview…','<p class="muted">Fetching file contents…</p>');try{const response=await fetch(url);if(!response.ok)throw new Error('Download request failed ('+response.status+')');const text=await response.text();if(text.length>2*1024*1024)throw new Error('Text preview is limited to 2 MB. Download the file to view the full contents.');window.tvCloseModal();modal(esc(name),'<p class="muted">Text preview · '+text.length.toLocaleString()+' characters</p><pre style="white-space:pre;overflow:auto;max-height:60vh;background:#17181c;border:1px solid #393a44;padding:12px;border-radius:8px;font:12px ui-monospace,monospace"><code>'+esc(text)+'</code></pre><div class="actions"><button class="primary" onclick="window.tvDownloadAttachment(decodeURIComponent(\''+encodeURIComponent(path)+'\'),decodeURIComponent(\''+encodeURIComponent(name)+'\'))">Download</button></div>')}catch(e){window.tvCloseModal();notify('Preview failed: '+(e.message||'could not read file'))}};
window.tvListZip=async(pathEncoded,nameEncoded,urlEncoded)=>{const path=decodeURIComponent(pathEncoded),name=decodeURIComponent(nameEncoded),url=decodeURIComponent(urlEncoded);if(!url)return notify('Archive preview unavailable: private link could not be created.');modal('Opening '+esc(name),'<p class="muted">Reading archive file list…</p>');try{const response=await fetch(url);if(!response.ok)throw new Error('Download request failed ('+response.status+')');const blob=await response.blob();if(blob.size>50*1024*1024)throw new Error('Archive is larger than the 50 MB preview limit.');const mod=await import('https://esm.sh/jszip@3.10.1');const zip=await mod.default.loadAsync(blob,{checkCRC32:false});const entries=Object.values(zip.files);const rows=entries.map(f=>'<div class="filecard" style="max-width:none"><span class="fileicon">'+(f.dir?'📁':'📄')+'</span><div class="fileinfo"><strong>'+esc(f.name)+'</strong><small>'+(f.dir?'Folder':'File')+'</small></div>'+(f.dir?'':'<button class="secondary smallbtn" onclick="window.tvPreviewZipEntry(\''+encodeURIComponent(url)+'\',\''+encodeURIComponent(name)+'\',\''+encodeURIComponent(f.name)+'\')">View</button>')+'</div>').join('');window.tvCloseModal();modal(esc(name)+' contents','<p class="muted">'+entries.length+' entries · '+(blob.size/1024).toFixed(1)+' KB compressed. Archive listing only; files are not extracted to your device.</p><div style="max-height:55vh;overflow:auto">'+(rows||'<p class="muted">Archive is empty.</p>')+'</div><div class="actions"><button class="primary" onclick="window.tvDownloadAttachment(decodeURIComponent(\''+encodeURIComponent(path)+'\'),decodeURIComponent(\''+encodeURIComponent(name)+'\'))">Download ZIP</button></div>')}catch(e){window.tvCloseModal();notify('Could not read archive: '+(e.message||'invalid or unsupported ZIP'))}};
window.tvPreviewZipEntry=async(urlEncoded,archiveNameEncoded,entryNameEncoded)=>{const url=decodeURIComponent(urlEncoded),archiveName=decodeURIComponent(archiveNameEncoded),entryName=decodeURIComponent(entryNameEncoded);if(!/\\.(js|ts|jsx|tsx|html|css|json|xml|yml|yaml|md|txt|py|java|c|cpp|h|cs|sh|sql|toml|ini|rs|go|php|rb|lua|log|csv)$/i.test(entryName))return notify('Only text/code files can be previewed from an archive.');try{const response=await fetch(url);if(!response.ok)throw new Error('Download request failed');const mod=await import('https://esm.sh/jszip@3.10.1');const zip=await mod.default.loadAsync(await response.blob(),{checkCRC32:false});const entry=zip.file(entryName);if(!entry)return notify('File was not found in the archive.');const content=await entry.async('string');if(content.length>2*1024*1024)throw new Error('Text preview is limited to 2 MB.');modal(esc(entryName)+' — '+esc(archiveName),'<pre style="white-space:pre;overflow:auto;max-height:65vh;background:#17181c;border:1px solid #393a44;padding:12px;border-radius:8px;font:12px ui-monospace,monospace"><code>'+esc(content)+'</code></pre>')}catch(e){notify('Could not preview archive entry: '+(e.message||'read failed'))}};

e and theme preset saved')}if(e.target.id==='reportForm'){e.preventDefault();const fd=new FormData(e.target);const message=messages.find(m=>m.id===fd.get('message_id'));const reportId=crypto.randomUUID();const report={id:reportId,reporter_id:session.user.id,message_id:fd.get('message_id')||null,reported_user_id:fd.get('reported_user_id')||null,reason:fd.get('reason'),details:(fd.get('details')||'').trim()};const r=await sb.from('content_reports').insert(report);if(r.error)return notify('Report could not be saved: '+r.error.message+' Check the content_reports grants and RLS policies using supabase/repair-report-permissions.sql.');let forwarded=false;try{const hook=await sb.functions.invoke('report-to-discord',{body:{report_id:reportId,reporter_id:session.user.id,reported_user_id:report.reported_user_id,message_id:report.message_id,reason:report.reason,details:report.details,message_content:message?.content||'',attachment_url:message?.attachment_url||null,attachment_name:message?.attachment_name||null,channel_id:channel?.id||null,server_id:server?.id||null,created_at:message?.created_at||null}});forwarded=!hook.error}catch{}window.tvCloseModal();notify(forwarded?'Report saved to Supabase and forwarded to moderation.':'Report saved to Supabase. Discord forwarding needs the Edge Function and DISCORD_WEBHOOK_URL secret configured.')} if(e.target.id==='serverForm'){e.preventDefault();let name=new FormData(e.target).get('name').trim();let r=await sb.rpc('create_server',{server_name:name});if(r.error)return notify(r.error.message);window.tvCloseModal();await loadServers();render()}if(e.target.id==='joinForm'){e.preventDefault();let code=new FormData(e.target).get('code').trim();try{if(code.includes('invite='))code=new URL(code).searchParams.get('invite')||code;else if(code.includes('/invite/'))code=code.split('/invite/').pop().split(/[?#]/)[0]}catch{}let r=await sb.rpc('join_server_by_invite',{code});if(r.error)return notify(r.error.message);window.tvCloseModal();await load rget_user:fd.get('user_id').trim(),amount:Number(fd.get('amount'))});if(r.error)return notify(r.error.message);notify('TvBoosters granted. New balance: '+r.data);window.tvBoostServer()}if(e.target.id==='serverSettingsForm'){e.preventDefault();let fd=new FormData(e.target);let patch={name:fd.get('name').trim(),description:(fd.get('description')||'').trim()};try{const iconFile=fd.get('icon_file'),bannerFile=fd.get('banner_file');if(iconFile?.size)patch.icon_url=await tvUploadServerImage(iconFile,'icon');if(bannerFile?.size)patch.banner_url=await tvUploadServerImage(bannerFile,'banner')}catch(err){return notify('Server image upload failed: '+err.message)}let code=(fd.get('code')||'').trim().toUpperCase();if(server.owner_id===session.user.id&&code&&code!==server.invite_code){let level=server.level||1;if(level<10)return notify('Custom invite codes unlock at server level 10.');patch.invite_code=code}let r=await sb.from('servers').update(patch).eq('id',server.id).select().single();if(r.error)return notify('Server settings save failed: '+r.error.message);server={...server,...r.data};servers=servers.map(x=>x.id===server.id?server:x);window.tvCloseModal();render();notify('Server settings saved')}if(e.target.id==='channelForm'){e.preventDefault();let name=new FormData(e.target).get('name').toLowerCase().replace(/[^a-z0-9-]/g,'-');let r=await sb.from('channels').insert({server_id:server.id,name,type:'text',position:channels.length}).select().single();if(r.error)return notify(r.error.message);channels.push(r.data);channel=r.data;window.tvCloseModal();await loadMessages()}if(e.target.id==='friendForm'){e.preventDefault();let uname=new FormData(e.target).get('username').trim();let r=await sb.rpc('send_friend_request',{target_username:uname});if(r.error)return notify(r.error.message);window.tvCloseModal();notify('Friend request sent.')}if(e.target.id==='profileForm'){e.preventDefault();let fd=new FormData(e.target);let patch={username:fd.get('username').trim(),status_text:fd.get('status').trim(),accent_color:fd.get('accent')};let r=await sb.from('profiles').update(patch).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}if(e.target.id==='bannerForm'){e.preventDefault();let file=new FormData(e.target).get('banner');if(!file?.size)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>10*1024*1024)return notify('Use a PNG, JPG, WebP, or GIF banner up to 10 MB.');let path=session.user.id+'/banner-'+Date.now()+'.'+(file.name.split('.').pop()||'gif');let up=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});if(up.error)return notify(up.error.message);let url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;let r=await sb.from('profiles').update({banner_url:url}).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}});

window.tvLeaveVoice=async()=>{stopRingtone();for(const pc of voicePeers.values())try{pc.close()}catch{}voicePeers.clear();document.querySelectorAll('audio[id^="voice-audio-"]').forEach(a=>{a.pause();a.srcObject=null;a.remove()});const room=voiceRoom;voiceRoom=null;if(room)try{await sb.removeChannel(room)}catch{}if(window.tvVoiceStream){window.tvVoiceStream.getTracks().forEach(t=>t.stop());window.tvVoiceStream=null}if(voiceScreenStream){voiceScreenStream.getTracks().forEach(t=>t.stop());voiceScreenStream=null}voiceChannel=null;voiceMembers=[];voiceMuted=false;voiceJoining=false;render();notify('Left voice channel')};
window.tvMuteVoice=async()=>{if(!window.tvVoiceStream)return notify('Microphone is not connected. Allow microphone access and choose Enable microphone / Retry.');voiceMuted=!voiceMuted;window.tvVoiceStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:!!voiceScreenStream,joined_at:new Date().toISOString()})}catch(e){console.warn('Could not update mute state',e)}voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,muted:voiceMuted}:m);render();notify(voiceMuted?'Microphone muted':'Microphone on')};
window.tvGoLive=async()=>{if(!window.tvVoiceStream)return notify('Connect your microphone before sharing your screen.');if(!navigator.mediaDevices?.getDisplayMedia)return notify('Screen sharing is not supported in this browser.');try{voiceScreenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const track=voiceScreenStream.getVideoTracks()[0];for(const [peerId,pc] of voicePeers){try{pc.addTrack(track,voiceScreenStream);if(pc.signalingState==='stable'){await pc.setLocalDescription(await pc.createOffer());await voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:peerId,from:session.user.id,offer:pc.localDescription}})}}catch(e){console.warn('Screen-share peer error',e)}}track.onended=()=>{voiceScreenStream?.getTracks().forEach(t=>t.stop());voiceScreenStream=null;render()};render();const v=document.getElementById('voice-screen-preview');if(v){v.srcObject=voiceScreenStream;v.classList.remove('hidden');await v.play().catch(()=>{})}try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:true,joined_at:new Date().toISOString()})}catch{}voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,live:true}:m);notify('You are live.')}catch(e){voiceScreenStream=null;notify('Screen sharing cancelled or unavailable: '+(e.message||'permission denied'))}};
window.tvJoinVoice=async id=>{
 const vc=channels.find(c=>c.id===id&&c.type==='voice');if(!vc)return;
 if(voiceJoining)return;
 if(voiceChannel?.id===vc.id&&window.tvVoiceStream){render();return}
 voiceJoining=true;
 voiceChannel=vc;voiceMembers=[];render();getAudio();playRingtone(8000);
 try{
  if(voiceRoom){try{await sb.removeChannel(voiceRoom)}catch{}voiceRoom=null}
  for(const pc of voicePeers.values())pc.close();voicePeers.clear();
  if(window.tvVoiceStream){window.tvVoiceStream.getTracks().forEach(t=>t.stop());window.tvVoiceStream=null}
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access requires HTTPS and a supported browser.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(!stream.getAudioTracks().length)throw new Error('No microphone audio track was provided by the browser. Check your microphone selection and permissions.');
  stream.getAudioTracks().forEach(t=>{t.enabled=true});
  voiceChannel=vc;voiceMuted=false;voiceMembers=[];window.tvVoiceStream=stream;
  const room=sb.channel('voice-'+vc.id,{config:{broadcast:{self:false},presence:{key:session.user.id}}});voiceRoom=room;
  const sendSignal=payload=>room.send({type:'broadcast',event:'signal',payload});
  const makePeer=async peerId=>{
   if(voicePeers.has(peerId))return voicePeers.get(peerId);
   const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});voicePeers.set(peerId,pc);
   stream.getTracks().forEach(t=>pc.addTrack(t,stream));
   pc.onicecandidate=e=>{if(e.candidate)sendSignal({to:peerId,from:session.user.id,candidate:e.candidate})};
   pc.ontrack=e=>{if(e.track.kind==='video'){let v=document.getElementById('voice-video-'+peerId);if(!v){v=document.createElement('video');v.id='voice-video-'+peerId;v.className='voice-video';v.autoplay=true;v.playsInline=true;v.controls=true;const grid=document.querySelector('.voice-grid');if(grid)grid.appendChild(v)}v.srcObject=e.streams[0];v.play?.().catch(()=>{});return}let a=document.getElementById('voice-audio-'+peerId);if(!a){a=document.createElement('audio');a.id='voice-audio-'+peerId;a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play?.().catch(()=>{})};
   pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){pc.close();voicePeers.delete(peerId)}};
   return pc;
  };
  room.on('broadcast',{event:'signal'},async({payload})=>{if(payload?.to!==session.user.id||!payload.from)return;try{await handleVoiceSignal(payload)}catch(e){console.error('Voice signaling failed',e)}});
  room.on('presence',{event:'sync'},async()=>{
   const state=room.presenceState();const next=[];
   for(const [key,items] of Object.entries(state)){const item=items?.[items.length-1];if(!item)continue;next.push({id:key,username:item.username||'User',avatar_url:item.avatar_url||null,muted:!!item.muted,live:!!item.live});if(key!==session.user.id&&session.user.id<key&&!voicePeers.has(key)){try{const pc=await makePeer(key);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal({to:key,from:session.user.id,offer:pc.localDescription})}catch(e){console.warn('Could not connect voice peer',key,e)}}}
   voiceMembers=next;render();
  });
  room.on('presence',{event:'join'},({key})=>{if(key&&key!==session.user.id){playRingtone(5000);notify('Someone joined '+vc.name)}});
  room.on('presence',{event:'leave'},()=>{});
  room.subscribe(async status=>{
   if(status==='SUBSCRIBED'){
    stopRingtone();voiceJoining=false;
    try{await room.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:false,live:false,joined_at:new Date().toISOString()});voiceMembers=[{id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:false,live:false}];render();notify('Joined voice: '+vc.name)}
    catch(e){notify('Joined voice, but presence could not start: '+(e.message||'unknown error'))}
   }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){notify('Voice connection failed ('+status+'). Leave voice and try again.')}
  });
  window.tvLeaveVoice=async()=>{
   if(voiceScreenStream){voiceScreenStream.getTracks().forEach(t=>t.stop());voiceScreenStream=null}
   for(const pc of voicePeers.values())pc.close();voicePeers.clear();
   document.querySelectorAll('audio[id^="voice-audio-"]').forEach(a=>{a.pause();a.srcObject=null;a.remove()});
   const old=voiceRoom;voiceRoom=null;if(old){try{await sb.removeChannel(old)}catch{}}
   stream.getTracks().forEach(t=>t.stop());window.tvVoiceStream=null;voiceChannel=null;voiceMembers=[];voiceMuted=false;voiceJoining=false;render();notify('Left voice channel');
  };
  window.tvMuteVoice=async()=>{if(!window.tvVoiceStream)return;voiceMuted=!voiceMuted;window.tvVoiceStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:!!voiceScreenStream,joined_at:new Date().toISOString()})}catch{}voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,muted:voiceMuted}:m);render();notify(voiceMuted?'Microphone muted':'Microphone on')};
  window.tvGoLive=async()=>{
   if(voiceScreenStream){for(const pc of voicePeers.values()){for(const sender of pc.getSenders()){if(sender.track?.kind==='video'){try{await sender.replaceTrack(null)}catch{}}}}voiceScreenStream.getTracks().forEach(t=>t.stop());voiceScreenStream=null;try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:false,joined_at:new Date().toISOString()})}catch{}voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,live:false}:m);render();return}
   if(!navigator.mediaDevices?.getDisplayMedia)return notify('Screen sharing is not supported in this browser.');
   try{voiceScreenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});render();const video=document.getElementById('voice-screen-preview');if(video){video.srcObject=voiceScreenStream;video.classList.remove('hidden');await video.play().catch(()=>{})}
    const track=voiceScreenStream.getVideoTracks()[0];if(track){for(const pc of voicePeers.values()){try{pc.addTrack(track,voiceScreenStream);if(pc.signalingState==='stable'){const offer=await pc.createOffer();await pc.setLocalDescription(offer);const peerId=[...voicePeers.entries()].find(([,peer])=>peer===pc)?.[0];if(peerId)await voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:peerId,from:session.user.id,offer:pc.localDescription}})}}catch(e){console.warn('Could not start live video for peer',e)}}track.onended=async()=>{if(voiceScreenStream){voiceScreenStream.getTracks().forEach(t=>t.stop());voiceScreenStream=null}try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:false,joined_at:new Date().toISOString()})}catch{}voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,live:false}:m);render()}};
    try{await voiceRoom?.track({user_id:session.user.id,username:profile.username,avatar_url:profile.avatar_url||null,muted:voiceMuted,live:true,joined_at:new Date().toISOString()})}catch{}
    voiceMembers=voiceMembers.map(m=>m.id===session.user.id?{...m,live:true}:m);render();notify('You are live. If a peer cannot see the stream, reconnect to voice and try again.');
   }catch(e){notify('Screen sharing cancelled or unavailable: '+(e.message||'permission denied'))}
  };
  render();
 }catch(e){stopRingtone();voiceJoining=false;if(window.tvVoiceStream){window.tvVoiceStream.getTracks().forEach(t=>t.stop());window.tvVoiceStream=null}voiceMembers=[];notify('Microphone could not start: '+(e.message||'permission denied'));render()}
};
async function handleVoiceSignal(p){
 let pc=voicePeers.get(p.from);
 if(!pc){
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});voicePeers.set(p.from,pc);
  (window.tvVoiceStream?.getTracks()||[]).forEach(t=>pc.addTrack(t,window.tvVoiceStream));
  pc.onicecandidate=e=>{if(e.candidate)voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:p.from,from:session.user.id,candidate:e.candidate}})};
  pc.ontrack=e=>{if(e.track.kind==='video'){let v=document.getElementById('voice-video-'+p.from);if(!v){v=document.createElement('video');v.id='voice-video-'+p.from;v.className='voice-video';v.autoplay=true;v.playsInline=true;v.controls=true;const grid=document.querySelector('.voice-grid');if(grid)grid.appendChild(v)}v.srcObject=e.streams[0];v.play?.().catch(()=>{});return}let a=document.getElementById('voice-audio-'+p.from);if(!a){a=document.createElement('audio');a.id='voice-audio-'+p.from;a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play?.().catch(()=>{})};
 }
 if(p.offer){if(pc.signalingState!=='stable')return;await pc.setRemoteDescription(p.offer);await pc.setLocalDescription(await pc.createAnswer());await voiceRoom?.send({type:'broadcast',event:'signal',payload:{to:p.from,from:session.user.id,answer:pc.localDescription}})}
 if(p.answer&&pc.signalingState==='have-local-offer')await pc.setRemoteDescription(p.answer);
 if(p.candidate)try{await pc.addIceCandidate(p.candidate)}catch{}
}
function renderVoiceStage(){
 const people=voiceMembers.length?voiceMembers:[{id:session.user.id,username:profile?.username||'You',avatar_url:profile?.avatar_url||null,muted:voiceMuted,live:!!voiceScreenStream}];
 return '<div class="voice-stage"><div><div class="voice-live">● VOICE CHANNEL</div><h2>'+esc(voiceChannel?.name||'Voice call')+'</h2><p class="muted">'+(voiceJoining?'Connecting and requesting microphone…':window.tvVoiceStream?people.length+' participant'+(people.length===1?'':'s')+' connected':'Call room open · microphone not connected')+'</p></div><div class="voice-grid">'+people.map(p=>'<div class="voice-tile">'+avatar(p)+'<strong>'+esc(p.username)+(p.id===session.user.id?' (you)':'')+'</strong><small>'+(p.live?'🔴 LIVE · sharing screen':p.muted?'🔇 Muted':'🎙️ Voice connected')+'</small></div>').join('')+'</div><video id="voice-screen-preview" class="voice-video hidden" autoplay muted playsinline></video><div class="voice-controls">'+(!window.tvVoiceStream&&!voiceJoining?'<button class="primary" onclick="window.tvJoinVoice(\''+voiceChannel.id+'\')">Enable microphone / Retry</button>':'')+'<button class="secondary" '+(!window.tvVoiceStream?'disabled':'')+' onclick="window.tvMuteVoice()">'+(voiceMuted?'Unmute microphone':'Mute microphone')+'</button><button class="secondary" onclick="window.tvGoLive()">'+(voiceScreenStream?'Stop sharing':'▣ Go Live / Share screen')+'</button><button class="danger" onclick="window.tvLeaveVoice()">Disconnect</button></div><p class="muted" style="font-size:12px">Your microphone is active while connected. Use Disconnect to leave the call.</p></div>';
}
window.tvServerSettings=()=>{if(!server)return;const can=server.owner_id===session.user.id||members.some(m=>m.id===session.user.id&&m.role==='admin')||members.some(m=>m.id===session.user.id&&(m.customRoles||[]).some(r=>r.can_manage_server));if(!can)return notify('You need the server settings permission from the server owner.');modal('Server settings','<form id="serverSettingsForm"><label class="field">Server name<input name="name" maxlength="80" required value="'+esc(server.name)+'" '+(!can?'disabled':'')+'></label><label class="field">Description<textarea name="description" maxlength="300" '+(!can?'disabled':'')+'>'+esc(server.description||'')+'</textarea></label><label class="field">Server picture<input name="icon_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" '+(!can?'disabled':'')+'><small>PNG, JPG, WebP or GIF · up to 10 MB. Leave empty to keep current.</small></label><label class="field">Server banner image<input name="banner_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" '+(!can?'disabled':'')+'><small>PNG, JPG, WebP or GIF · up to 10 MB. Leave empty to keep current.</small></label><label class="field">Custom invite code <small>Unlocked at level 10</small><input name="code" maxlength="24" pattern="[A-Za-z0-9_-]{4,24}" value="'+esc(server.invite_code)+'" '+(!can?'disabled':'')+'></label><p class="muted">Level '+(server.level||1)+' · '+(server.total_boosters||0)+' TvBoosters used · Discovery requires level 10 and 15 members.</p><div class="actions"><button type="button" class="secondary" onclick="window.tvManageRoles()">Manage roles</button><button type="button" class="secondary" onclick="window.tvManageEmojis()">Custom emojis</button><button type="button" class="secondary" onclick="window.tvBoostServer()">TvBoosters</button><button type="button" class="secondary" onclick="window.tvToggleDiscovery()">'+(server.discoverable?'Disable discovery':'Enable discovery')+'</button></div><button class="primary full" style="marg window.tvToggleDiscovery=async()=>{if(!server)return;const r=await sb.rpc('set_server_discovery',{target_server:server.id,enabled:!server.discoverable});if(r.error)return notify(r.error.message);server.discoverable=!server.discoverable;servers=servers.map(s=>s.id===server.id?server:s);window.tvServerSettings();notify(server.discoverable?'Server listed in discovery':'Server removed from discovery')};

window.tvSpendBoost=async()=>{if(!server)return;const r=await sb.rpc('boost_server',{target_server:server.id});if(r.error)return notify(r.error.message);server.level=r.data.level;server.total_boosters=r.data.total_boosters;servers=servers.map(s=>s.id===server.id?server:s);window.tvBoostServer();notify('Server boosted to level '+server.level)};
window.tvManageRoles=async()=>{if(!server)return;const r=await sb.from('server_roles').select('*').eq('server_id',server.id).order('position');if(r.error)return notify('Run supabase/community-features.sql first: '+r.error.message);modal('Server roles','<form id="createRoleForm"><label class="field">Role name<input name="name" maxlength="32" required></label><label class="field">Role color<input name="color" type="color" value="#e34b64"></label>'+(server.owner_id===session.user.id?'<label class="field"><input type="checkbox" name="can_manage_server" value="yes"> Can manage server settings</label>':'')+'<button class="primary full">Create role</button></form><hr><form id="assignRoleForm"><label class="field">Member<select name="user_id" required>'+members.map(m=>'<option value="'+m.id+'">'+esc(m.username)+'</option>').join('')+'</select></label><label class="field">Role<select name="role_id" required>'+((r.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join(''))+'</select></label><button class="secondary full">Assign role</button></form><hr>'+((r.data||[]).map(x=>'<div class="friendrow"><span style="color:'+esc(x.color)+'">●</span><strong>'+esc(x.name)+'</strong></div>').join('')||'<p class="muted">No custom roles yet.</p>'))};
window.tvManageEmojis=async()=>{if(!server)return;const r=await sb.from('server_emojis').select('*').eq('server_id',server.id).order('name');if(r.error)return notify('Run supabase/community-features.sql first: '+r.error.message);modal('Custom server emojis','<form id="createEmojiForm"><label class="field">Emoji name<input name="name" pattern="[A-Za-z0-9_]{2,32}" required placeholder="cool_cat"></label><label class="field">Emoji image<input name="emoji_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required><small>PNG, JPG, WebP or GIF · up to 5 MB.</small></label><button class="primary full">Upload custom emoji</button></form><hr>'+((r.data||[]).map(x=>'<div class="friendrow"><img src="'+esc(x.image_url)+'" alt=":'+esc(x.name)+':" style="width:28px;height:28px;object-fit:contain"><strong>:'+esc(x.name)+':</strong></div>').join('')||'<p class="muted">No custom emojis yet.</p>'))};
window.tvEmojiPicker=async()=>{let custom=[];if(server){const r=await sb.from('server_emojis').select('name,image_url').eq('server_id',server.id);if(!r.error)custom=r.data||[]}const emojis=['😀','😎','😂','🥹','😍','😭','😡','🤔','👍','👎','❤️','💀','🔥','🎉','✨','🚀','👀','🙏','💯','✅','❌','🎮','🐱','🐸','🍕','⭐'];modal('Emoji picker','<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:7px">'+emojis.map(e=>'<button type="button" class="secondary" style="font-size:22px;padding:8px" onclick="window.tvInsertEmoji(\''+e+'\')">'+e+'</button>').join('')+custom.map(e=>'<button type="button" class="secondary" title=":'+esc(e.name)+':" onclick="window.tvInsertEmoji(\':'+esc(e.name)+':\')"><img src="'+esc(e.image_url)+'" style="width:22px;height:22px;object-fit:contain" alt="'+esc(e.name)+'"></button>').join('')+'</div><button class="secondary full" style="margin-top:12px" onclick="window.tvCloseModal();window.tvManageEmojis()">Manage custom emojis</button>')};
window.tvInsertEmoji=e=>{const d=$('draft');if(d){d.value+=e;d.focus()}window.tvCloseModal()};

window.tvProfile=()=>modal('Profile, themes & account','<div class="banner" style="height:100px;background-image:url('+ (profile.banner_url?'\''+esc(profile.banner_url)+'\'':'none') +');background-size:cover;background-position:center"></div><form id="profileForm"><label class="field">Username<input name="username" maxlength="32" required value="'+esc(profile.username)+'"></label><label class="field">Status / about me<input name="status" maxlength="80" value="'+esc(profile.status_text||'')+'"></label><label class="field">Theme preset<select name="themePreset"><option value="default">Midnight</option><option value="rose">Rose</option><option value="ocean">Ocean</option><option value="forest">Forest</option><option value="amethyst">Amethyst</option><option value="sunset">Sunset</option></select></label><button class="primary full">Save profile & theme</button></form><hr><form id="avatarForm"><label class="field">Profile picture (GIF supported)<input type="file" name="avatar" accept="image/png,image/jpeg,image/webp,image/gif" required></label><button class="secondary full">Upload profile picture</button></form><hr><form id="bannerForm"><label class="field">Profile banner (GIF supported)<input type="file" name="banner" accept="image/png,image/jpeg,image/webp,image/gif" required></label><button class="secondary full">Upload banner</button></form><button class="secondary full" style="margin-top:8px" onclick="window.tvAdminPanel()">Admin panel</button>');
window.tvAdminPanel=async()=>{const check=await sb.functions.invoke('admin-ban',{body:{action:'check'}});if(check.error){let detail=check.error.message||'Unknown Edge Function error';try{const ctx=check.error.context;if(ctx?.json){const body=await ctx.json();if(body?.error)detail=body.error}}catch{}return notify('Admin check failed: '+detail)}if(!check.data?.is_admin)return notify(check.data?.error||'Admin check failed: Supabase did not confirm admin access. Check the deployed admin-ban function and TVCORD_ADMIN_USER_IDS secret.');modal('TvCord admin panel','<p class="muted">Admin actions are verified by the backend using TVCORD_ADMIN_USER_IDS. TvBooster grants are restricted to this panel and require the recipient to be in the official TvCord server.</p><form id="adminGiveBoostForm"><h3>Give TvBoosters</h3><label class="field">Recipient user ID (UUID)<input name="user_id" required placeholder="Supabase Auth user UUID"></label><label class="field">Amount<input name="amount" type="number" min="1" max="100" step="1" value="2" required></label><button class="primary full">Grant TvBoosters</button></form><hr><p class="muted">User IDs are public account identifiers. Ban/restriction changes are enforced by the database migration.</p><form id="adminBanForm"><label class="field">User ID (UUID)<input name="user_id" required placeholder="00000000-0000-0000-0000-000000000000"></label><label class="field">Reason<input name="reason" maxlength="300" value="Safety policy violation" required></label><label class="field">Ban duration<select name="duration"><option value="permanent">Permanent restriction</option><option value="1h">1 hour</option><option value="24h">24 hours</option><option value="7d">7 days</option><option value="30d">30 days</option></select></label><button class="primary full">Ban / restrict account</button></form><hr><form id="adminUnbanForm"><label class="field">Unban user ID<input name="user_id" required></label><button class="secondary full">Remove restriction</button></form>')};
window.tvResetTheme=()=>{for(const [k,v] of Object.entries({'--bg':'#17181c','--side':'#202127','--rail':'#111216'}))document.documentElement.style.setProperty(k,v);try{localStorage.removeItem('tvcord-theme-'+session.user.id)}catch{}notify('Theme reset');window.tvProfile()};
const TV_THEMES={default:{'--bg':'#17181c','--side':'#202127','--rail':'#111216'},rose:{'--bg':'#21151b','--side':'#321e28','--rail':'#160e13'},ocean:{'--bg':'#101c28','--side':'#172a3a','--rail':'#0b121b'},forest:{'--bg':'#142019','--side':'#203328','--rail':'#0b1510'},amethyst:{'--bg':'#1b1528','--side':'#2a203d','--rail':'#110d1b'},sunset:{'--bg':'#271914','--side':'#3b251c','--rail':'#1a100d'}};function applySavedTheme(){try{const t=JSON.parse(localStorage.getItem('tvcord-theme-'+session.user.id)||'{}');const preset=TV_THEMES[t.preset]||TV_THEMES.default;for(const [k,v] of Object.entries(preset))document.documentElement.style.setProperty(k,v)}catch{}}
document.addEventListener('submit',async e=>{if(e.target.id==='avatarForm'){e.preventDefault();let f=new FormData(e.target).get('avatar');if(!f?.size||!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>10*1024*1024)return notify('Use a PNG, JPG, WebP, or GIF avatar up to 10 MB.');let path=session.user.id+'/avatar-'+Date.now()+'.'+(f.name.split('.').pop()||'gif');let u=await sb.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(u.error)return notify(u.error.message);let url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;let r=await sb.from('profiles').update({avatar_url:url}).eq('id',session.user.id).select().single();if(r.error)return notify(r.error.message);profile=r.data;window.tvCloseModal();render()}});

window.tvOpenDoc=which=>{const file=which==='tos'?'tos.html':'pap.html';window.open(file,'_self')};
async function loadFriends(){let r=await sb.from('friendships').select('id,requester_id,addressee_id,status,requester:profiles!friendships_requester_id_fkey(id,username,avatar_url,status_text),addressee:profiles!friendships_addressee_id_fkey(id,username,avatar_url,status_text)').or('requester_id.eq.'+session.user.id+',addressee_id.eq.'+session.user.id).eq('status','accepted');friends=(r.data||[]).map(f=>({id:f.id,profile:f.requester_id===session.user.id?f.addressee:f.requester,otherId:f.requester_id===session.user.id?f.addressee_id:f.requester_id}));}
window.tvAddFriend=()=>modal('Add a friend','<p class="muted">Enter their exact TvCord username.</p><form id="friendForm"><label class="field">Username<input name="username" required maxlength="32"></label><button class="primary full">Send request</button></form>');
window.tvRequests=async()=>{let r=await sb.from('friendships').select('id,requester_id,requester:profiles!friendships_requester_id_fkey(id,username,avatar_url)').eq('addressee_id',session.user.id).eq('status','pending');if(r.error)return notify(r.error.message);modal('Friend requests',(r.data||[]).map(x=>'<div class="friendrow">'+avatar(x.requester)+'<div class="username"><strong>'+esc(x.requester.username)+'</strong><small>Wants to connect</small></div><button class="primary smallbtn" onclick="window.tvAccept(\''+x.id+'\')">Accept</button><button class="secondary smallbtn" onclick="window.tvReject(\''+x.id+'\')">Reject</button></div>').join('')||'<p class="muted">No pending requests.</p>')};
window.tvAccept=async id=>{let r=await sb.from('friendships').update({status:'accepted'}).eq('id',id).eq('addressee_id',session.user.id);if(r.error)return notify(r.error.message);window.tvRequests();loadFriends()};
window.tvReject=async id=>{let r=await sb.from('friendships').delete().eq('id',id).eq('addressee_id',session.user.id);if(r.error)return notify(r.error.message);window.tvRequests()};
window.tvDM=async other=>{let r=await sb.rpc('get_or_create_dm',{other_user:other});if(r.error)return notify(r.error.message);view='dm';modal('Direct messages','<p class="muted">DM conversation created. DM tables and realtime transport require the TvCord social migration to be run in Supabase.</p><code>'+esc(r.data)+'</code>')};
window.tvLogout=async()=>{const r=await sb.auth.signOut();if(r.error)return notify(r.error.message);};
const startupTimeout = ms => new Promise((_, reject) => setTimeout(() => reject(new Error('Supabase did not respond in time. Check the project URL, public key, and Supabase status.')), ms));
Promise.race([sb.auth.getSession(), startupTimeout(12000)]).then(async({data,error})=>{
 if(error)throw error;
 session=data.session;
 if(session){$('configError').textContent='Signing you in…';return boot()}
 $('configError').textContent='Connected to Supabase. Ready to sign in.';
}).catch(async error=>{
 console.error('TvCord startup failed:',error);
 const message=String(error?.message||error||'Could not reach Supabase');
 if(/Cannot parse given Error object|invalid.*session|malformed.*session/i.test(message)){
   try{localStorage.removeItem('sb-dbiinubzfmsqlzngrjoc-auth-token')}catch{}
   session=null;
   $('configError').textContent='Your saved login session could not be read. Please log in again.';
 }else{
   $('configError').textContent='Connection failed: '+message+'. Check your connection and refresh.';
 }
});
</script></body></html>
